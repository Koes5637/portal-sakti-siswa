    <style>

        /* DESAIN RAK BUKU & FLIPBOOK */
        .rak-buku-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 2.5rem 1.5rem;
            padding: 1.5rem 1rem 3rem 1rem;
            background: repeating-linear-gradient(to bottom, transparent, transparent 195px, #d1d5db 195px, #94a3b8 210px);
        }
        .dark .rak-buku-container {
            background: repeating-linear-gradient(to bottom, transparent, transparent 195px, #334155 195px, #1e293b 210px);
        }
        .buku-cover {
            aspect-ratio: 2 / 3;
            border-radius: 4px 10px 10px 4px;
            box-shadow: inset 4px 0 10px rgba(0,0,0,0.1), 5px 5px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .buku-cover:hover {
            transform: translateY(-10px) rotateY(-5deg);
            box-shadow: inset 4px 0 10px rgba(0,0,0,0.1), 10px 15px 25px rgba(0,0,0,0.5);

    <script>
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        window.formatTextAman = function(text) {
            if (!text) return '';
            // Deteksi jika tipe datanya berupa objek dari bank soal
            let str = (typeof text === 'object') ? (text.text || JSON.stringify(text)) : String(text);
            const parts = str.split(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g);
            return parts.map(part => {
                if (part.startsWith('$')) return part;
                return part.replace(/\n/g, '<br>');
            }).join('');
        };
        
        window.ubahModeLayar = function(mode) {
            const panelKiri = document.getElementById('panel-kiri');
            const panelKanan = document.getElementById('panel-kanan');
            const tombol = document.querySelectorAll('.mode-btn');
            
            tombol.forEach(btn => {
                btn.classList.remove('bg-indigo-100', 'dark:bg-indigo-900/60', 'text-indigo-700', 'dark:text-indigo-400', 'active-mode');
                btn.classList.add('text-slate-600', 'dark:text-slate-300');
            });

            if (mode === 'materi') {
                panelKiri.style.width = '100%'; panelKiri.style.display = 'flex';
                panelKanan.style.width = '0%'; panelKanan.style.display = 'none';
                if(tombol.length > 0) tombol[0].classList.add('bg-indigo-100', 'dark:bg-indigo-900/60', 'text-indigo-700', 'dark:text-indigo-400');
            } else if (mode === 'soal') {
                panelKiri.style.width = '0%'; panelKiri.style.display = 'none';
                panelKanan.style.width = '100%'; panelKanan.style.display = 'flex';
                if(tombol.length > 0) tombol[2].classList.add('bg-indigo-100', 'dark:bg-indigo-900/60', 'text-indigo-700', 'dark:text-indigo-400');
            } else {
                panelKiri.style.width = '50%'; panelKiri.style.display = 'flex';
                panelKanan.style.width = '50%'; panelKanan.style.display = 'flex';
                if(tombol.length > 0) tombol[1].classList.add('bg-indigo-100', 'dark:bg-indigo-900/60', 'text-indigo-700', 'dark:text-indigo-400');
            }
        };

        window.toggleFullscreen = function(containerId) {
            const elem = document.getElementById(containerId);
            if (!elem) return;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        };

        let db = null;
        let dataSiswa = null;
        let semuaModul = []; 
        let kategoriAktif = "KBM_Harian";
        let subMenuAktif = "materi"; 
        let modulAktif = null; 
        let progresSiswa = {}; 
        let indeksSoalAktif = 0; 
        let jawabanSiswa = {}; 
        let raguSiswa = {}; 
        let timerInterval = null;

        function showLoading(show, text="Memproses Data...") {
            document.getElementById('loading-text').innerText = text;
            const el = document.getElementById('loading-overlay');
            if (show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        window.onload = async () => {
            const savedConfig = localStorage.getItem('sakti_school_config');
            const nis = localStorage.getItem('student_nis');

            if (!savedConfig || !nis) {
                alert("Sesi Anda tidak valid atau telah berakhir. Silakan login kembali.");
                window.location.href = 'index.html'; 
                return;
            }

            try {
                const configObj = JSON.parse(savedConfig);
                let schoolApp;
                if (firebase.apps.filter(app => app.name === 'AppSekolah').length === 0) {
                    schoolApp = firebase.initializeApp(configObj, 'AppSekolah');
                } else {
                    schoolApp = firebase.app('AppSekolah');
                }
                
                await schoolApp.auth().signInAnonymously();
                db = schoolApp.firestore();

                const docSiswa = await db.collection('siswa').doc(nis).get();
                if(!docSiswa.exists) throw new Error("Data siswa tidak ditemukan.");
                dataSiswa = docSiswa.data();
                dataSiswa.nis = docSiswa.id;
                
                document.getElementById('info-siswa').innerText = `${dataSiswa.nama} • KELAS ${dataSiswa.kelas}`;

                const progSnap = await db.collection('progres_belajar').where('nis', '==', dataSiswa.nis).get();
                progresSiswa = {};
                progSnap.forEach(d => { progresSiswa[d.data().id_modul] = d.data(); });

                await fetchModulSakti();
                filterKategori('KBM_Harian');

            } catch(e) {
                console.error(e);
                alert("Terjadi kesalahan: " + e.message);
                window.location.href = 'index.html'; 
            } finally {
                showLoading(false);
            }
        };

        async function fetchModulSakti() {
            try {
                const snap = await db.collection('modul_sakti').where('tugasAktif', '==', true).get();
                semuaModul = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    let isTarget = false;
                    
                    if (data.is_publik) {
                        if (data.target_tingkat && data.target_tingkat.length > 0) {
                            isTarget = data.target_tingkat.some(tingkat => dataSiswa.kelas.startsWith(tingkat));
                        } else {
                            isTarget = true; 
                        }
                    } else {
                        isTarget = data.target_kelas && data.target_kelas.includes(dataSiswa.kelas);
                    }

                    if (isTarget) semuaModul.push({ id: doc.id, ...data });
                });
                
                const mapels = [...new Set(semuaModul.filter(m => m.tipe_konten === 'materi').map(m => m.mapel))].sort();
                const dMapel = document.getElementById('filter-mapel-buku');
                if (dMapel) {
                    dMapel.innerHTML = '<option value="SEMUA">Semua Mata Pelajaran</option>';
                    mapels.forEach(m => dMapel.innerHTML += `<option value="${m}">${m}</option>`);
                }
            } catch (e) {
                console.error("Gagal menarik data modul:", e);
            }
        }

        window.renderModul = function() {
            const container = document.getElementById('modul-container');
            container.innerHTML = ""; 

            const filterMapel = document.getElementById('filter-mapel-buku') ? document.getElementById('filter-mapel-buku').value : 'SEMUA';

            let dataFilter = semuaModul.filter(m => m.kategori === kategoriAktif && m.tipe_konten === subMenuAktif);
            
            if (subMenuAktif === 'materi' && filterMapel !== 'SEMUA') {
                dataFilter = dataFilter.filter(m => m.mapel === filterMapel);
            }

            dataFilter.sort((a, b) => {
                if(!a.batas_waktu) return 1;
                if(!b.batas_waktu) return -1;
                return new Date(a.batas_waktu) - new Date(b.batas_waktu);
            });

                container.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

                        <i class="ph ph-folder-open text-6xl mb-4 opacity-50"></i>

                return;
            }

            const waktuSekarang = new Date(); 
            // Mesin Waktu: Batas 24 Jam untuk memunculkan lencana
            const batasBaru = new Date(waktuSekarang.getTime() - (24 * 60 * 60 * 1000));

            if (subMenuAktif === 'materi') {

                    'linear-gradient(135deg, #e11d48 0%, #9f1239 100%)', 
                    'linear-gradient(135deg, #d97706 0%, #b45309 100%)', 
                    'linear-gradient(135deg, #4f46e5 0%, #3730a3 100%)',

                    }
                    const warnaTerpilih = paletWarna[kodeWarna % paletWarna.length];

                                <div><span class="text-xs font-bold text-indigo-700 dark:text-indigo-400 block mb-1">NILAI AKHIR</span><span class="text-[10px] font-bold text-indigo-500">Benar ${prog.jumlah_benar} dari ${prog.total_soal}</span></div>

                    card.style.animationDelay = `${index * 0.1}s`;

                        </button>
                    `;
                    container.appendChild(card);

        async function catatAktivitas(isMateriSaja) {
            const nisValid = dataSiswa.nis || localStorage.getItem('student_nis');
            const docId = `${nisValid}_${modulAktif.id}`;
            const waktuSekarang = new Date().toISOString();
            
            const payload = {
                nis: nisValid, nama: dataSiswa.nama, kelas: dataSiswa.kelas,
                id_modul: modulAktif.id, judul_modul: modulAktif.judul, mapel: modulAktif.mapel,
                waktu_akses_terakhir: waktuSekarang
            };

            if(isMateriSaja) {
                payload.status_tugas = "Selesai Membaca";
            } else {
                payload.status_tugas = payload.status_tugas || "Sedang Mengerjakan";
                if(progresSiswa && progresSiswa[modulAktif.id]) {
                    if(!progresSiswa[modulAktif.id].waktu_mulai) payload.waktu_mulai = waktuSekarang;
                } else {
                    payload.waktu_mulai = waktuSekarang;
                }
            }

            try { 
                await db.collection('progres_belajar').doc(docId).set(payload, { merge: true }); 
                if(!isMateriSaja && payload.waktu_mulai) {
                    if(!progresSiswa[modulAktif.id]) progresSiswa[modulAktif.id] = {};
                    progresSiswa[modulAktif.id].waktu_mulai = payload.waktu_mulai;
                }
            } catch (e) {}
        }

        function mulaiTimer(batasWaktuISO, durasiMenit) {
            clearInterval(timerInterval);
            const timerDisplay = document.getElementById('timer-display');
            
            let batasAkhir = null;

            if (batasWaktuISO) batasAkhir = new Date(batasWaktuISO).getTime();

            if (durasiMenit) {
                let wMulai = new Date().getTime(); 
                if (progresSiswa && progresSiswa[modulAktif.id] && progresSiswa[modulAktif.id].waktu_mulai) {
                    wMulai = new Date(progresSiswa[modulAktif.id].waktu_mulai).getTime();
                }
                const batasDurasi = wMulai + (durasiMenit * 60 * 1000);
                
                if (!batasAkhir || batasDurasi < batasAkhir) {
                    batasAkhir = batasDurasi;
                }
            }

            if(!batasAkhir) { 
                timerDisplay.innerText = "Tak Terbatas"; return; 
            }
            
            timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const selisih = batasAkhir - now;
                
                if(selisih <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "WAKTU HABIS";
                    alert("Waktu pengerjaan Anda telah habis! Sistem akan mengumpulkan lembar jawaban secara otomatis.");
                    kumpulkanTugas(true); 
                } else {
                    const hours = Math.floor((selisih % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((selisih % (1000 * 60)) / 1000);
                    timerDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    if(hours === 0 && minutes < 5) timerDisplay.classList.add('animate-pulse');
                    else timerDisplay.classList.remove('animate-pulse');
                }
            }, 1000);
        }

        window.bukaModul = async function(id, isLocked, isDone) {
            if (isLocked) { alert("Maaf, akses ke modul ini telah ditutup karena melewati batas waktu."); return; }
            if (isDone) { alert("Anda sudah menyelesaikan tugas ini! Nilai Anda sudah tercatat di sistem."); return; }

            modulAktif = semuaModul.find(m => m.id === id);
            document.getElementById('simulasi-judul').innerText = modulAktif.judul;
            document.getElementById('simulasi-mapel').innerText = modulAktif.mapel;
            jawabanSiswa = {}; 
            raguSiswa = {}; 
            
            if (modulAktif.tipe_konten === 'materi') {
                siapkanTampilanMateri(); catatAktivitas(true); 
            } else {
                siapkanTampilanTugas(); 
                await catatAktivitas(false); 
                mulaiTimer(modulAktif.batas_waktu, modulAktif.durasi_menit);
            }

            document.getElementById('view-etalase').classList.add('hidden');
            document.getElementById('view-simulasi').classList.remove('hidden');
            document.getElementById('view-simulasi').classList.add('flex');
            
            if (window.MathJax) MathJax.typesetPromise();
        }

                    <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-lg shrink-0 border border-indigo-200 dark:border-indigo-700">${dataSiswa.nama.charAt(0).toUpperCase()}</div>
                    <div class="flex-1 relative">
                        <textarea id="input-komentar" rows="2" class="w-full p-4 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none focus:ring-2 ring-indigo-500 text-sm shadow-sm transition-shadow custom-scrollbar" placeholder="Tuliskan pertanyaan atau tanggapan Anda di sini..."></textarea>
                        <div class="flex justify-end mt-2">
                            <button id="btn-kirim-materi" onclick="kirimKomentarMateri('${modulAktif.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md shadow-indigo-600/30 transition-all flex items-center gap-2 active:scale-95"><i class="ph ph-paper-plane-tilt text-lg"></i> Kirim</button>
                        </div>
                    </div>
                </div>
                
                <div id="wadah-komentar" class="space-y-4">
                    <div class="text-center py-6 text-slate-400"><i class="ph ph-spinner animate-spin text-3xl mb-2"></i><br>Memuat diskusi...</div>
                </div>
            </div>`;
            
            document.getElementById('simulasi-wacana').innerHTML = konten;
            loadKomentarMateri(modulAktif.id);
        };

        function acakArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        window.siapkanTampilanTugas = async function() {
            const panelKendali = document.getElementById('panel-kendali-layar');

            if (modulAktif.kategori !== 'KBM_Harian') {
                ubahModeLayar('soal'); 
                panelKendali.classList.remove('md:flex');
                panelKendali.classList.add('hidden');
                
                if (!modulAktif.sudahDiacak) {
                    let blokSoal = [];
                    let grupMap = {};

                    modulAktif.soal_latihan.forEach(soal => {
                        const gId = soal.metadata && soal.metadata.groupId ? soal.metadata.groupId : null;
                        if (gId) {
                            if (grupMap[gId] !== undefined) {
                                blokSoal[grupMap[gId]].push(soal);
                            } else {
                                grupMap[gId] = blokSoal.length;
                                blokSoal.push([soal]);
                            }
                        } else {
                            blokSoal.push([soal]);
                        }
                    });

                    blokSoal = acakArray(blokSoal);
                    modulAktif.soal_latihan = [];
                    blokSoal.forEach(blok => {
                        modulAktif.soal_latihan = modulAktif.soal_latihan.concat(blok);
                    });

                    modulAktif.soal_latihan.forEach(soal => {
                        if (!soal.type || soal.type === 'pg' || soal.type === 'pgk') {
                            if (soal.opsi && Array.isArray(soal.opsi)) {
                                soal.opsiPemetaan = soal.opsi.map((opt, idx) => ({ teks: opt, idxAsli: String(idx) }));
                                soal.opsiPemetaan = acakArray(soal.opsiPemetaan);
                            }
                        }
                    });
                    
                    modulAktif.sudahDiacak = true;
                }
            } else {
                ubahModeLayar('split'); 
                panelKendali.classList.add('md:flex');
                panelKendali.classList.remove('hidden');
            }
            
            document.getElementById('footer-tugas').classList.remove('hidden');
            document.getElementById('wadah-timer').classList.remove('hidden');
            document.getElementById('header-panel-kiri').classList.remove('hidden');
            
            let kontenKiri = modulAktif.materi_html || "Bacalah wacana dengan saksama.";
            
            if (modulAktif.syarat_materi_id) {
                try {
                    const snap = await db.collection('modul_sakti').doc(modulAktif.syarat_materi_id).get();
                    if (snap.exists) {
                        kontenKiri = snap.data().materi_html || kontenKiri; 
                        const badge = document.getElementById('badge-syarat');
                        if(badge) { badge.classList.remove('hidden'); badge.innerText = "Syarat: " + snap.data().judul; }
                    }
                } catch(e) { }
            }
            
            const gdriveMatch = kontenKiri.match(/(?:https?:\/\/)?(?:drive\.google\.com\/(?:file\/d\/|open\?id=))([a-zA-Z0-9_-]+)/);
            if(gdriveMatch) {
                kontenKiri = kontenKiri.replace(/https?:\/\/drive\.google\.com\/[^\s]+/, ''); 
                const containerId = 'fullscreen-tugas-' + gdriveMatch[1];
                kontenKiri += `
                <div id="${containerId}" class="mt-4 w-full h-[75vh] bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden relative">
                    <div class="absolute top-0 right-0 z-10 p-2">
                        <button onclick="toggleFullscreen('${containerId}')" class="bg-white/90 dark:bg-slate-800/90 backdrop-blur text-xs px-3 py-1.5 rounded-lg shadow-md text-indigo-600 dark:text-indigo-400 font-bold hover:scale-105 transition-transform border border-indigo-100 dark:border-indigo-800">
                            <i class="ph ph-arrows-out"></i> Perluas
                        </button>
                    </div>
                    <iframe src="https://drive.google.com/file/d/${gdriveMatch[1]}/preview" class="w-full h-full border-none bg-white" allow="fullscreen" allowfullscreen></iframe>
                </div>`;
            }
            
            document.getElementById('simulasi-wacana').innerHTML = kontenKiri;
            indeksSoalAktif = 0;
            renderSoalAktif();
        };

        window.simpanJawabanSpesifik = function(idxAsli, val, type, subIdx = null) {
            if (!type || type === 'pg') {
                jawabanSiswa[idxAsli] = String(val);
            } else if (type === 'pgk') {
                let arr = jawabanSiswa[idxAsli] || [];
                if(arr.includes(String(val))) arr = arr.filter(v => v !== String(val));
                else arr.push(String(val));
                jawabanSiswa[idxAsli] = arr;
            } else if (type === 'bs') {
                let obj = jawabanSiswa[idxAsli] || {};
                obj[subIdx] = String(val);
                jawabanSiswa[idxAsli] = obj;
            } else if (type === 'esai-singkat' || type === 'esai-kompleks') {
                jawabanSiswa[idxAsli] = val;
            }
            
            indeksSoalAktif = idxAsli; 
            
            const panel = document.querySelector('#panel-kanan .flex-1');
            const scrollTop = panel ? panel.scrollTop : 0;
            renderSoalAktif(); 
            if(panel) setTimeout(() => { panel.scrollTop = scrollTop; }, 10);
        }

        window.toggleRagu = function() {
            const cb = document.getElementById('cb-ragu');
            if(cb.checked) raguSiswa[indeksSoalAktif] = true;
            else delete raguSiswa[indeksSoalAktif];
            renderGridNavigasi();
        }

        window.toggleNavigasiPanel = function() {
            const panel = document.getElementById('panel-navigasi-soal');
            const drawer = document.getElementById('drawer-navigasi');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                panel.classList.add('flex');
                setTimeout(() => drawer.classList.remove('translate-x-full'), 10);
                renderGridNavigasi();
            } else {
                drawer.classList.add('translate-x-full');
                setTimeout(() => { panel.classList.add('hidden'); panel.classList.remove('flex'); }, 300);
            }
        }

        window.lompatKeSoal = function(idx) {
            indeksSoalAktif = idx;
            toggleNavigasiPanel();
            renderSoalAktif();
        }

        function renderGridNavigasi() {
            const grid = document.getElementById('grid-navigasi-angka');
            if(!grid || !modulAktif || !modulAktif.soal_latihan) return;
            
            grid.innerHTML = modulAktif.soal_latihan.map((_, idx) => {
                let bgClass = "bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-50";
                
                const jwb = jawabanSiswa[idx];
                const isDijawab = (jwb !== undefined && jwb !== null && jwb !== "") && 
                                  (Array.isArray(jwb) ? jwb.length > 0 : true) && 
                                  (typeof jwb === 'object' && !Array.isArray(jwb) ? Object.keys(jwb).length > 0 : true);

                if (isDijawab) bgClass = "bg-green-500 border-green-600 text-white font-bold";
                if (raguSiswa[idx]) bgClass = "bg-yellow-400 border-yellow-500 text-yellow-900 font-bold"; 

                const ringClass = (idx === indeksSoalAktif) ? "ring-4 ring-indigo-300 dark:ring-indigo-600 scale-110 z-10 font-black" : "font-bold";
                return `<button onclick="lompatKeSoal(${idx})" class="w-full aspect-square flex items-center justify-center rounded-lg border-2 ${bgClass} ${ringClass} transition-all shadow-sm">${idx + 1}</button>`;
            }).join('');
        }

        function renderSoalAktif() {
            if (!modulAktif.soal_latihan || modulAktif.soal_latihan.length === 0) return;
            
            const soalSaatIni = modulAktif.soal_latihan[indeksSoalAktif];
            const gId = soalSaatIni.metadata && soalSaatIni.metadata.groupId ? soalSaatIni.metadata.groupId : null;
            
            let startIndex = indeksSoalAktif;
            if (gId) {
                while(startIndex > 0 && modulAktif.soal_latihan[startIndex-1].metadata?.groupId === gId) startIndex--;
            }
            
            let soalGrup = [];
            let i = startIndex;
            while (i < modulAktif.soal_latihan.length) {
                let currentGid = modulAktif.soal_latihan[i].metadata?.groupId;
                if (gId && currentGid === gId) {
                    soalGrup.push({ data: modulAktif.soal_latihan[i], realIdx: i });
                } else if (!gId && i === startIndex) {
                    soalGrup.push({ data: modulAktif.soal_latihan[i], realIdx: i });
                } else {
                    break;
                }
                i++;
            }
            
            let endIndex = i - 1; 

            const divNomorSoal = document.getElementById('nomor-soal');
            if(divNomorSoal) divNomorSoal.parentElement.style.display = 'none';
            const divSimulasiPertanyaan = document.getElementById('simulasi-pertanyaan');
            if(divSimulasiPertanyaan) divSimulasiPertanyaan.innerHTML = '';
            const divSimulasiOpsi = document.getElementById('simulasi-opsi');
            if(divSimulasiOpsi) divSimulasiOpsi.innerHTML = '';

            let htmlKumpulan = '';
            
            soalGrup.forEach((item) => {
                const soalData = item.data;
                const idx = item.realIdx;
                const noUrut = idx + 1;
                
                const teksSoal = window.formatTextAman(soalData.naskah || soalData.soal_teks || "Teks soal tidak tersedia.");
                let imgSoal = soalData.naskahImage ? `<img src="${soalData.naskahImage}" class="max-h-64 mt-3 rounded-lg shadow border border-slate-200">` : '';
                if(!soalData.naskahImage && soalData.gambar) imgSoal = `<img src="${soalData.gambar}" class="max-h-64 mt-3 rounded-lg shadow">`;
                
                const tipeLabel = (soalData.type || 'PG').toUpperCase();
                let opsiHtml = '';
                const jawabanTersimpan = jawabanSiswa[idx];

                if (!soalData.type || soalData.type === 'pg' || soalData.type === 'pgk') {
                    if (soalData.type === 'pgk') opsiHtml += `<div class="mb-3 text-xs text-indigo-500 font-bold"><i class="ph ph-check-square-offset"></i> Pilih lebih dari satu jawaban:</div>`;
                    const opsiAktif = soalData.opsiPemetaan ? soalData.opsiPemetaan : (soalData.opsi || []).map((opt, idopt) => ({ teks: opt, idxAsli: String(idopt) }));

                    opsiAktif.forEach((optItem, indexTampil) => {
                        const huruf = String.fromCharCode(65 + indexTampil); 
                        const textOpt = window.formatTextAman(typeof optItem.teks === 'object' ? (optItem.teks.text || "") : optItem.teks);
                        const imgOpt = (typeof optItem.teks === 'object' && optItem.teks.imageBase64) ? `<br><img src="${optItem.teks.imageBase64}" class="max-h-32 mt-2 rounded">` : '';

                        const isSelected = (soalData.type === 'pgk') ? (jawabanTersimpan && jawabanTersimpan.includes(optItem.idxAsli)) : (jawabanTersimpan === optItem.idxAsli);
                        const bgClass = isSelected ? 'bg-indigo-50 dark:bg-indigo-900/30 border-indigo-500' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700';
                        
                        if (soalData.type === 'pgk') {
                            const boxClass = isSelected ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-slate-300 dark:border-slate-500 bg-white dark:bg-slate-700';
                            opsiHtml += `<div onclick="simpanJawabanSpesifik(${idx}, '${optItem.idxAsli}', 'pgk')" class="p-3 border-2 rounded-xl cursor-pointer transition-all flex gap-3 items-start mb-3 ${bgClass}"><div class="w-6 h-6 rounded-md border-2 flex items-center justify-center shrink-0 font-bold transition-colors ${boxClass}">${isSelected ? '✓' : ''}</div><div class="flex-1 mt-0.5 text-sm">${textOpt}${imgOpt}</div></div>`;
                        } else {
                            opsiHtml += `<div onclick="simpanJawabanSpesifik(${idx}, '${optItem.idxAsli}', 'pg')" class="p-3 border-2 rounded-xl cursor-pointer transition-all flex gap-3 items-start mb-3 ${bgClass}"><div class="w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 font-bold ${isSelected ? 'border-indigo-500 bg-indigo-500 text-white' : 'border-slate-300 text-slate-500'}">${huruf}</div><div class="flex-1 mt-0.5 text-sm">${textOpt}${imgOpt}</div></div>`;
                        }
                    });
                } else if (soalData.type === 'bs') {
                    opsiHtml += `<div class="mb-3 text-xs text-indigo-500 font-bold"><i class="ph ph-scales"></i> Tentukan B/S:</div><table class="w-full text-sm border-collapse"><thead class="bg-slate-100 dark:bg-slate-700"><tr><th class="p-3 text-left border dark:border-slate-600">Pernyataan</th><th class="p-3 w-16 text-center border dark:border-slate-600">B</th><th class="p-3 w-16 text-center border dark:border-slate-600">S</th></tr></thead><tbody>`;
                    (soalData.opsi || []).forEach((opt, subIdx) => {
                        const textOpt = window.formatTextAman(typeof opt === 'object' ? (opt.text || "") : opt);
                        const ans = (jawabanTersimpan && jawabanTersimpan[subIdx]) ? jawabanTersimpan[subIdx] : null;
                        const btnB = ans === 'true' ? 'bg-indigo-500 text-white scale-110 shadow-md' : 'bg-slate-200 dark:bg-slate-600 text-slate-400 hover:bg-slate-300';
                        const btnS = ans === 'false' ? 'bg-indigo-500 text-white scale-110 shadow-md' : 'bg-slate-200 dark:bg-slate-600 text-slate-400 hover:bg-slate-300';
                        opsiHtml += `<tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50"><td class="p-3 border dark:border-slate-600 text-slate-700 dark:text-slate-200">${textOpt}</td><td class="p-2 border dark:border-slate-600 text-center"><button onclick="simpanJawabanSpesifik(${idx}, 'true', 'bs', '${subIdx}')" class="w-8 h-8 rounded-full ${btnB} font-bold transition-all">B</button></td><td class="p-2 border dark:border-slate-600 text-center"><button onclick="simpanJawabanSpesifik(${idx}, 'false', 'bs', '${subIdx}')" class="w-8 h-8 rounded-full ${btnS} font-bold transition-all">S</button></td></tr>`;
                    });
                    opsiHtml += `</tbody></table>`;
                } else if (soalData.type === 'esai-singkat' || soalData.type === 'esai-kompleks') {
                    opsiHtml += `<textarea onchange="simpanJawabanSpesifik(${idx}, this.value, '${soalData.type}')" class="w-full p-4 border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl focus:ring-2 ring-indigo-500 outline-none custom-scrollbar text-slate-800 dark:text-slate-200 transition-all" rows="${soalData.type === 'esai-singkat' ? 2 : 6}" placeholder="Ketik jawaban...">${jawabanTersimpan || ""}</textarea>`;
                }

                htmlKumpulan += `
                <div class="mb-10 pb-6 border-b-2 border-slate-200 dark:border-slate-700 border-dashed last:border-b-0">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-puspendik-blue text-white rounded-lg flex items-center justify-center font-bold text-xl shadow-md">${noUrut}</div>
                            <span class="text-[10px] font-bold px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded text-slate-600 dark:text-slate-300 shadow-sm border border-slate-200 dark:border-slate-600">${tipeLabel}</span>
                        </div>
                    </div>
                    <div class="text-base md:text-lg font-semibold mb-6 leading-relaxed text-slate-800 dark:text-slate-100">${teksSoal + imgSoal}</div>
                    <div class="space-y-3">${opsiHtml}</div>
                </div>`;
            });

            if(divSimulasiPertanyaan) {
                divSimulasiPertanyaan.innerHTML = htmlKumpulan;
                divSimulasiPertanyaan.style.display = 'block';
            }

            const btnBerikutnya = document.getElementById('btn-berikutnya');
            const teksBtn = document.getElementById('teks-btn-berikutnya');
            const ikonBtn = document.getElementById('ikon-btn-berikutnya');

            if (endIndex === modulAktif.soal_latihan.length - 1) {
                btnBerikutnya.classList.replace('bg-puspendik-blue', 'bg-green-600');
                btnBerikutnya.classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
                teksBtn.innerText = "Kumpulkan"; ikonBtn.className = "ph ph-check-circle text-lg";
                btnBerikutnya.onclick = () => kumpulkanTugas(false);
            } else {
                btnBerikutnya.classList.replace('bg-green-600', 'bg-puspendik-blue');
                btnBerikutnya.classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
                teksBtn.innerText = "Berikutnya"; ikonBtn.className = "ph ph-caret-right text-lg";
                btnBerikutnya.onclick = () => navigasiSoal((endIndex + 1) - indeksSoalAktif);
            }

            const cbRagu = document.getElementById('cb-ragu');
            if (cbRagu) {
                let anyRagu = false;
                for(let k = startIndex; k <= endIndex; k++) { if(raguSiswa[k]) anyRagu = true; }
                cbRagu.checked = anyRagu;
            }
            
            if(typeof renderGridNavigasi === 'function') renderGridNavigasi(); 

            if (window.MathJax) MathJax.typesetPromise([document.getElementById('panel-kanan')]);
        }

        window.navigasiSoal = function(arah) {
            if(arah < 0) {
                const soalSaatIni = modulAktif.soal_latihan[indeksSoalAktif];
                const gId = soalSaatIni.metadata && soalSaatIni.metadata.groupId ? soalSaatIni.metadata.groupId : null;
                
                let startIndex = indeksSoalAktif;
                if (gId) {
                    while(startIndex > 0 && modulAktif.soal_latihan[startIndex-1].metadata?.groupId === gId) startIndex--;
                }
                
                if (startIndex > 0) {
                    let prevGid = modulAktif.soal_latihan[startIndex-1].metadata?.groupId;
                    let targetIdx = startIndex - 1;
                    if(prevGid) {
                        while(targetIdx > 0 && modulAktif.soal_latihan[targetIdx-1].metadata?.groupId === prevGid) targetIdx--;
                    }
                    indeksSoalAktif = targetIdx;
                } else {
                    indeksSoalAktif = 0;
                }
            } else {
                indeksSoalAktif += arah;
            }
            
            if (indeksSoalAktif < 0) indeksSoalAktif = 0;
            if (indeksSoalAktif >= modulAktif.soal_latihan.length) indeksSoalAktif = modulAktif.soal_latihan.length - 1;
            renderSoalAktif();
        }

        window.kumpulkanTugas = async function(isAutoSubmit) {
            if(!isAutoSubmit) {
                const sisaKosong = modulAktif.soal_latihan.length - Object.keys(jawabanSiswa).length;
                let pesan = "Yakin ingin mengumpulkan tugas sekarang?";
                if(sisaKosong > 0) pesan = `Ada ${sisaKosong} soal yang BELUM DIJAWAB! ${pesan}`;
                if(!confirm(pesan)) return;
            }

            clearInterval(timerInterval);
            showLoading(true, "Mengkoreksi & Menyimpan Data...");

            try {
                let totalSkorDidapat = 0;
                let totalBobotMaksimal = 0;
                const totalSoal = modulAktif.soal_latihan.length;
                const jawabanDetailArray = [];
                const manualScores = {};
                let hitungBenar = 0;

                for (let i = 0; i < totalSoal; i++) {
                    const soal = modulAktif.soal_latihan[i];
                    const idSoal = soal.id;
                    const jwbSiswa = jawabanSiswa[i] || null;
                    
                    const bobotSoal = parseFloat(soal.skor) || 1; 
                    totalBobotMaksimal += bobotSoal;
                    jawabanDetailArray.push({ id: idSoal, answer: jwbSiswa });

                    try {
                        const snapKunci = await db.collection('bank_soal_privat').doc(idSoal).get();
                        if (snapKunci.exists) {
                            const dataKunci = snapKunci.data();
                            const kunciAsli = dataKunci.kunci;
                            let poinSoalSiswa = 0;

                            if (!soal.type || soal.type === 'pg') {
                                if (String(jwbSiswa) === String(kunciAsli)) poinSoalSiswa = bobotSoal;
                            } else if (soal.type === 'esai-singkat') {
                                let safeSiswa = String(jwbSiswa || '').trim().toLowerCase().replace(/\s+/g, '');
                                let safeKunci = String(kunciAsli || '').trim().toLowerCase().replace(/\s+/g, '');
                                if (safeSiswa === safeKunci) poinSoalSiswa = bobotSoal;
                            } else if (soal.type === 'pgk') {
                                let arrSiswa = Array.isArray(jwbSiswa) ? jwbSiswa.map(String) : [];
                                let arrKunci = Array.isArray(kunciAsli) ? kunciAsli.map(String) : [];
                                let n = Array.isArray(soal.opsi) ? soal.opsi.length : 0;
                                let jumlahKunci = arrKunci.length;

                                if (jumlahKunci > 0 && n > 0) {
                                    let skorBenar = bobotSoal / jumlahKunci;
                                    let skorSalah = skorBenar / -2;
                                    let B = 0; let S = 0;
                                    arrSiswa.forEach(ans => { if (arrKunci.includes(ans)) B++; else S++; });
                                    if (arrSiswa.length === n) poinSoalSiswa = 0;
                                    else {
                                        let skorSementara = (B * skorBenar) + (S * skorSalah);
                                        poinSoalSiswa = skorSementara < 0 ? 0 : skorSementara;
                                    }
                                }
                            } else if (soal.type === 'bs') {
                                let kArr = Array.isArray(kunciAsli) ? kunciAsli : [];
                                let matchCount = 0;
                                if (kArr.length > 0) {
                                    kArr.forEach((k, kIdx) => {
                                        let sBS = jwbSiswa && jwbSiswa[kIdx] !== undefined ? String(jwbSiswa[kIdx]).toLowerCase() : "null";
                                        let kBS = String(k).toLowerCase();
                                        if (sBS === kBS) matchCount++;
                                    });
                                    poinSoalSiswa = (matchCount / kArr.length) * bobotSoal;
                                }
                            }

                            totalSkorDidapat += poinSoalSiswa;
                            manualScores[idSoal] = poinSoalSiswa;
                            if (poinSoalSiswa >= bobotSoal) hitungBenar++; 
                        }
                    } catch (errKunci) { manualScores[idSoal] = 0; }
                }

                // Menghitung presisi desimal (contoh: 3.33) tanpa pembulatan kasar
                const nilaiAkhir = totalBobotMaksimal > 0 ? parseFloat(((totalSkorDidapat / totalBobotMaksimal) * 100).toFixed(2)) : 0;
                const nisValid = dataSiswa.nis || localStorage.getItem('student_nis');
                const namaValid = dataSiswa.nama || "Nama Siswa";
                const kelasValid = dataSiswa.kelas || "Umum";
                const docId = `${nisValid}_${modulAktif.id}`;

                const payloadProgres = {
                    status_tugas: "Selesai", waktu_kumpul: new Date().toISOString(),
                    jawaban_siswa: jawabanSiswa, nilai_akhir: nilaiAkhir,
                    jumlah_benar: hitungBenar, total_soal: totalSoal
                };
                
                const payloadHasilUjian = {
                    nis: nisValid, nama: namaValid, kelas: kelasValid,
                    ujianId: modulAktif.id, skor: nilaiAkhir, 
                    manualScores: manualScores, jawabanDetail: jawabanDetailArray,
                    timestamp: new Date().toISOString()
                };

                await db.collection('progres_belajar').doc(docId).set(payloadProgres, { merge: true });
                await db.collection('hasil_ujian').doc(docId).set(payloadHasilUjian, { merge: true });
                
                showLoading(false);
                
                if(typeof progresSiswa !== 'undefined') progresSiswa[modulAktif.id] = payloadProgres;
                
                if (modulAktif.kategori === 'KBM_Harian') {
                    alert(`🎉 TUGAS SELESAI!\n\nNama: ${namaValid}\nNilai Anda: ${nilaiAkhir}`);
                } else {
                    alert(`✅ UJIAN SELESAI!\n\nJawaban simulasi Anda telah terekam di sistem dengan aman.`);
                }
                
                // --- PENUTUPAN PAKSA TANPA KONFIRMASI (BUG FIX) ---
                if(document.fullscreenElement) document.exitFullscreen();
                document.getElementById('view-simulasi').classList.add('hidden');
                document.getElementById('view-simulasi').classList.remove('flex');
                document.getElementById('view-etalase').classList.remove('hidden');
                modulAktif = null;
                // --------------------------------------------------

                if(typeof renderModul === 'function') renderModul();
                
            } catch (e) {
                console.error(e); showLoading(false);
                alert("Gagal mengirim jawaban! Pastikan internet stabil dan aturan database terbuka.");
            }
        }

        window.tutupSimulasi = function() {
            if(document.fullscreenElement) document.exitFullscreen();
            
            if(modulAktif && modulAktif.tipe_konten !== 'materi') {
                if(confirm("Apakah Anda yakin ingin keluar? Timer akan terus berjalan dan jawaban sementara tidak akan tersimpan hingga Anda menekan Kumpulkan.")) {
                    clearInterval(timerInterval);
                    document.getElementById('view-simulasi').classList.add('hidden');
                    document.getElementById('view-simulasi').classList.remove('flex');
                    document.getElementById('view-etalase').classList.remove('hidden');
                    modulAktif = null;
                }
            } else {
                document.getElementById('view-simulasi').classList.add('hidden');
                document.getElementById('view-simulasi').classList.remove('flex');
                document.getElementById('view-etalase').classList.remove('hidden');
                modulAktif = null;
            }
        }
		// --- MESIN FORUM DISKUSI PER MATERI ---
        window.loadKomentarMateri = async function(idModul) {
            const wadah = document.getElementById('wadah-komentar');
            if(!wadah) return;
            try {
                // Menghapus .orderBy() agar tidak ditolak Firebase, data akan diurutkan manual di bawah
                db.collection('diskusi_materi').where('id_modul', '==', idModul)
                  .onSnapshot(snap => {
                      if(snap.empty) {
                          wadah.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-xl">Belum ada diskusi. Jadilah yang pertama bertanya!</div>`;
                          return;
                      }
                      
                      // Kumpulkan pesan dan urutkan secara mandiri lewat Javascript
                      let pesanArray = [];
                      snap.forEach(doc => { pesanArray.push(doc.data()); });
                      pesanArray.sort((a, b) => new Date(b.waktu) - new Date(a.waktu));

                      let html = '';
                      pesanArray.forEach(d => {
                          const tgl = new Date(d.waktu).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                          const isGuru = d.role === 'guru';
                          
                          const bgWarna = isGuru ? 'bg-amber-50 border-amber-200 dark:bg-amber-900/20 dark:border-amber-800' : 'bg-slate-50 border-slate-200 dark:bg-slate-800/50 dark:border-slate-700';
                          const namaTampil = isGuru ? `${d.nama} <span class="bg-amber-500 text-white px-1.5 py-0.5 rounded text-[8px] ml-1 shadow-sm">GURU</span>` : d.nama;
                          
                          html += `
                          <div class="flex gap-3 fade-in">
                              <div class="w-8 h-8 rounded-full ${isGuru ? 'bg-amber-100 text-amber-600' : 'bg-slate-200 text-slate-600'} flex items-center justify-center font-bold text-sm shrink-0">${d.nama.charAt(0).toUpperCase()}</div>
                              <div class="flex-1 p-4 rounded-2xl rounded-tl-none border ${bgWarna}">
                                  <div class="flex justify-between items-start mb-2">
                                      <span class="text-xs font-bold text-slate-700 dark:text-slate-300">${namaTampil}</span>
                                      <span class="text-[9px] font-semibold text-slate-400">${tgl}</span>
                                  </div>
                                  <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${window.formatTextAman ? window.formatTextAman(d.teks) : d.teks}</p>
                              </div>
                          </div>`;
                      });
                      wadah.innerHTML = html;
                  });
            } catch(e) {
                wadah.innerHTML = `<div class="text-center py-4 text-red-400 text-sm">Gagal memuat diskusi. Pastikan koneksi internet stabil.</div>`;
            }
        }

        window.kirimKomentarMateri = async function(idModul) {
            const input = document.getElementById('input-komentar');
            const teks = input.value.trim();
            if(!teks) return alert("Pesan tidak boleh kosong!");
            
            const nisValid = (typeof dataSiswa !== 'undefined' && dataSiswa && dataSiswa.nis) ? dataSiswa.nis : localStorage.getItem('student_nis');
            const namaValid = (typeof dataSiswa !== 'undefined' && dataSiswa && dataSiswa.nama) ? dataSiswa.nama : "Siswa";
            const kelasValid = (typeof dataSiswa !== 'undefined' && dataSiswa && dataSiswa.kelas) ? dataSiswa.kelas : "Umum";
            
            try {
                input.disabled = true;
                const btn = document.getElementById('btn-kirim-materi');
                const btnTextOri = btn ? btn.innerHTML : 'Kirim';
                if(btn) btn.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Mengirim...`;
                
                await db.collection('diskusi_materi').add({
                    id_modul: idModul,
                    nis: nisValid,
                    nama: namaValid,
                    kelas: kelasValid,
                    role: 'siswa',
                    teks: teks,
                    waktu: new Date().toISOString()
                });
                
                input.value = '';
                input.disabled = false;
                if(btn) btn.innerHTML = btnTextOri;
            } catch(e) {
                console.error("Kesalahan sistem:", e);
                alert("Gagal mengirim pesan. " + e.message);
                input.disabled = false;
            }
        }
		// --- MESIN FORUM DISKUSI GLOBAL ---
        let unsubscribeForumGlobal = null;
        window.loadForumGlobal = async function() {
            const wadah = document.getElementById('list-pesan-global');
            if(!wadah) return;
            
            wadah.innerHTML = `<div class="text-center py-10"><i class="ph ph-spinner animate-spin text-3xl text-slate-400 mb-2"></i><p class="text-slate-500 text-sm font-medium">Menyinkronkan obrolan kelas...</p></div>`;
            
            if(unsubscribeForumGlobal) unsubscribeForumGlobal();
            
            try {
                unsubscribeForumGlobal = db.collection('diskusi_global')
                    .orderBy('waktu', 'desc')
                    .limit(50) // Hanya memuat 50 pesan terakhir agar aplikasi tetap ringan
                    .onSnapshot(snap => {
                        if(snap.empty) {
                            wadah.innerHTML = `<div class="text-center py-10 text-slate-400 font-medium border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl bg-white dark:bg-slate-800">Belum ada obrolan. Jadilah yang pertama menyapa kelas! 👋</div>`;
                            return;
                        }
                        let html = '';
                        snap.forEach(doc => {
                            const d = doc.data();
                            const tgl = new Date(d.waktu).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                            const isGuru = d.role === 'guru';
                            const nisValid = dataSiswa ? (dataSiswa.nis || localStorage.getItem('student_nis')) : null;
                            const isSaya = d.nis === nisValid;
                            
                            // Pewarnaan khusus: Kuning untuk Guru, Biru untuk diri sendiri, Putih untuk teman lain
                            const bgWarna = isGuru ? 'bg-amber-50 border-amber-200 dark:bg-amber-900/30 dark:border-amber-800' : (isSaya ? 'bg-indigo-50 border-indigo-200 dark:bg-indigo-900/30 dark:border-indigo-800' : 'bg-white border-slate-200 dark:bg-slate-800/80 dark:border-slate-700');
                            const warnaTeksNama = isGuru ? 'text-amber-600' : (isSaya ? 'text-indigo-600' : 'text-slate-700 dark:text-slate-300');
                            const labelPeran = isGuru ? `<span class="bg-amber-500 text-white px-1.5 py-0.5 rounded text-[8px] ml-1 shadow-sm font-black tracking-wider">GURU</span>` : `<span class="text-[9px] font-normal text-slate-400 bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded ml-1 border border-slate-200 dark:border-slate-600">${d.kelas}</span>`;
                            
                            html += `
                            <div class="flex gap-3 fade-in">
                                <div class="w-10 h-10 rounded-full ${isGuru ? 'bg-amber-100 text-amber-600' : 'bg-slate-200 text-slate-600'} flex items-center justify-center font-bold shrink-0 shadow-sm text-lg">${d.nama.charAt(0).toUpperCase()}</div>
                                <div class="flex-1 p-5 rounded-2xl rounded-tl-none border ${bgWarna} shadow-sm">
                                    <div class="flex justify-between items-start mb-3">
                                        <span class="text-sm font-bold ${warnaTeksNama}">${d.nama} ${labelPeran}</span>
                                        <span class="text-[10px] font-semibold text-slate-400 bg-white/50 dark:bg-black/20 px-2 py-0.5 rounded-full">${tgl}</span>
                                    </div>
                                    <p class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">${window.formatTextAman ? window.formatTextAman(d.teks) : d.teks}</p>
                                </div>
                            </div>`;
                        });
                        wadah.innerHTML = html;
                    });
            } catch (e) {
                wadah.innerHTML = `<div class="text-center py-4 text-red-500 text-sm font-bold">Gagal memuat diskusi.</div>`;
            }
        }

        window.kirimPesanGlobal = async function() {
            const input = document.getElementById('input-forum-global');
            const teks = input.value.trim();
            if(!teks) return alert("Pesan tidak boleh kosong!");
            
            // Perbaikan Fallback Memori yang Aman
            const nisValid = (typeof dataSiswa !== 'undefined' && dataSiswa && dataSiswa.nis) ? dataSiswa.nis : localStorage.getItem('student_nis');
            const namaValid = (typeof dataSiswa !== 'undefined' && dataSiswa && dataSiswa.nama) ? dataSiswa.nama : "Siswa";
            const kelasValid = (typeof dataSiswa !== 'undefined' && dataSiswa && dataSiswa.kelas) ? dataSiswa.kelas : "Umum";

            try {
                input.disabled = true;
                const btn = input.nextElementSibling.querySelector('button');
                const btnTextOri = btn.innerHTML;
                btn.innerHTML = `<i class="ph ph-spinner animate-spin"></i> Mengirim...`;
                
                await db.collection('diskusi_global').add({
                    nis: nisValid,
                    nama: namaValid,
                    kelas: kelasValid,
                    role: 'siswa',
                    teks: teks,
                    waktu: new Date().toISOString()
                });
                
                input.value = '';
                input.disabled = false;
                btn.innerHTML = btnTextOri;
            } catch(e) {
                alert("Gagal mengirim pesan. Periksa koneksi.");
                input.disabled = false;
            }
        }
    </script>
