<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruang Belajar - SAKTI LMS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- KONFIGURASI TEMA -->
    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'puspendik-blue': '#1a73e8',
                        'puspendik-yellow': '#fbbc04',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE COMPAT SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <!-- MESIN RENDER MATEMATIKA (MATHJAX) -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .opsi-label:active { transform: scale(0.98); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">

    <!-- OVERLAY LOADING -->
    <div id="loading-overlay" class="fixed inset-0 z-[200] bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
        <p id="loading-text" class="text-sm font-bold text-indigo-600 dark:text-indigo-400">Menyiapkan Ruang Belajar...</p>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 1: ETALASE BELAJAR (DAFTAR MODUL)     -->
    <!-- ========================================== -->
    <div id="view-etalase" class="block pb-20">
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm sticky top-0 z-40 transition-colors duration-300">
            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <!-- TOMBOL KEMBALI MENUJU INDEX.HTML (DASHBOARD) -->
                    <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded-xl flex items-center justify-center text-xl hover:bg-indigo-200 transition-colors" title="Kembali ke Dashboard">
                        <i class="ph ph-arrow-left"></i>
                    </button>
                    <div>
                        <h1 class="font-bold text-lg leading-tight dark:text-white">Ruang Belajar</h1>
                        <p id="info-siswa" class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">Memuat...</p>
                    </div>
                </div>
                <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-300 transition-colors focus:outline-none">
                    <i class="ph ph-moon dark:hidden text-2xl"></i>
                    <i class="ph ph-sun hidden dark:block text-2xl"></i>
                </button>
            </div>

            <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-6 overflow-x-auto border-t border-slate-100 dark:border-slate-700 pt-1">
                <button onclick="filterKategori('KBM_Harian')" id="tab-KBM_Harian" class="kategori-tab py-3 border-b-2 font-bold text-sm text-indigo-600 border-indigo-600 dark:text-indigo-400 dark:border-indigo-400 whitespace-nowrap transition-colors">
                    KBM Harian
                </button>
                <button onclick="filterKategori('TKA')" id="tab-TKA" class="kategori-tab py-3 border-b-2 border-transparent font-bold text-sm text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300 whitespace-nowrap transition-colors">
                    Fokus TKA
                </button>
                <button onclick="filterKategori('UTBK')" id="tab-UTBK" class="kategori-tab py-3 border-b-2 border-transparent font-bold text-sm text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300 whitespace-nowrap transition-colors">
                    Pejuang UTBK
                </button>
            </div>
        </header>

        <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div id="modul-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Modul dirender via JS -->
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: RUANG SIMULASI (PUSPENDIK UI)      -->
    <!-- ========================================== -->
    <div id="view-simulasi" class="hidden h-screen overflow-hidden flex-col">
        <header class="w-full h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm z-50 flex justify-between items-center px-4 md:px-6 shrink-0 transition-colors duration-300">
            <div class="flex items-center gap-3">
                <button onclick="tutupSimulasi()" class="mr-2 text-slate-400 hover:text-red-500 transition-colors focus:outline-none">
                    <i class="ph ph-x-circle text-2xl"></i>
                </button>
                <div>
                    <h1 id="simulasi-judul" class="font-bold text-sm md:text-lg leading-tight dark:text-white">Memuat...</h1>
                    <p id="simulasi-mapel" class="text-[10px] md:text-xs text-slate-500 dark:text-slate-400">Mapel</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 md:gap-6">
                <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-3 py-2 rounded-lg text-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors focus:outline-none" title="Ganti Tema">
                    <i class="ph ph-moon dark:hidden"></i>
                    <i class="ph ph-sun hidden dark:block"></i>
                </button>

                <div class="text-right flex items-center gap-2 border-l border-slate-200 dark:border-slate-600 pl-3 md:pl-6" id="wadah-timer">
                    <i class="ph ph-timer text-2xl text-slate-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider leading-none mb-0.5">Sisa Waktu</p>
                        <p id="timer-display" class="font-mono font-bold text-lg leading-none text-red-600 dark:text-red-400">00:00:00</p>
                    </div>
                </div>
                <button class="bg-puspendik-blue hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors focus:outline-none">
                    <i class="ph ph-squares-four text-lg"></i> <span class="hidden md:inline">Daftar Soal</span>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col md:flex-row w-full overflow-hidden relative">
            
            <!-- OVERLAY JIKA HANYA MATERI (Bukan Tugas) -->
            <div id="overlay-materi" class="absolute inset-0 z-10 bg-slate-50 dark:bg-slate-900 hidden flex-col">
                <div class="w-full h-full p-6 md:p-12 overflow-y-auto max-w-4xl mx-auto text-justify">
                    <h3 class="font-bold text-lg text-indigo-600 dark:text-indigo-400 mb-6 uppercase tracking-widest border-b border-slate-300 dark:border-slate-700 pb-4">
                        <i class="ph ph-book-open"></i> Pustaka Materi
                    </h3>
                    <div id="simulasi-wacana-materi" class="leading-relaxed text-slate-800 dark:text-slate-200 max-w-none prose dark:prose-invert">
                        <!-- Teks Pengantar / Link Embed akan muncul di sini -->
                    </div>
                </div>
            </div>

            <!-- Sisi Kiri (Wacana - Mode Tugas) -->
            <div class="w-full md:w-1/2 h-[40%] md:h-full p-6 md:p-8 overflow-y-auto bg-slate-50 dark:bg-slate-900 border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-700 text-justify transition-colors duration-300">
                <h3 class="font-bold text-sm text-slate-500 mb-4 uppercase tracking-widest border-b border-slate-300 dark:border-slate-600 pb-2">Informasi / Pengantar</h3>
                <div id="simulasi-wacana" class="leading-relaxed text-slate-800 dark:text-slate-200 max-w-none prose dark:prose-invert">
                    Memuat materi...
                </div>
            </div>

            <!-- Sisi Kanan (Soal & Opsi - Mode Tugas) -->
            <div class="w-full md:w-1/2 h-[60%] md:h-full p-6 md:p-8 overflow-y-auto bg-white dark:bg-slate-800 relative pb-24 transition-colors duration-300">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-3">
                        <div id="nomor-soal" class="w-10 h-10 bg-puspendik-blue text-white rounded-lg flex items-center justify-center font-bold text-xl">1</div>
                        <span class="text-xs font-bold px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded text-slate-600 dark:text-slate-300">Pilihan Ganda</span>
                    </div>
                </div>

                <div id="simulasi-pertanyaan" class="text-lg font-semibold mb-6 leading-relaxed text-slate-800 dark:text-slate-100">
                    Memuat soal...
                </div>

                <div id="simulasi-opsi" class="space-y-3">
                    <!-- Opsi Jawaban Dirender JS -->
                </div>
            </div>
        </main>

        <footer class="w-full h-16 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 z-50 flex justify-between items-center px-2 md:px-6 shrink-0 transition-colors duration-300">
            <button onclick="navigasiSoal(-1)" class="bg-slate-500 hover:bg-slate-600 text-white px-4 md:px-6 py-2.5 rounded-lg text-xs md:text-sm font-bold transition-colors flex items-center gap-2">
                <i class="ph ph-caret-left text-lg"></i> <span class="hidden md:inline">Sebelumnya</span>
            </button>
            <label class="bg-puspendik-yellow hover:bg-yellow-500 text-slate-900 px-4 md:px-6 py-2.5 rounded-lg text-xs md:text-sm font-bold cursor-pointer transition-colors flex items-center gap-2 shadow-sm">
                <input type="checkbox" class="w-4 h-4 accent-slate-900"> Ragu-ragu
            </label>
            <button onclick="navigasiSoal(1)" class="bg-puspendik-blue hover:bg-blue-700 text-white px-4 md:px-6 py-2.5 rounded-lg text-xs md:text-sm font-bold transition-colors flex items-center gap-2">
                <span class="hidden md:inline">Berikutnya</span> <i class="ph ph-caret-right text-lg"></i>
            </button>
        </footer>
    </div>

    <!-- LOGIKA JAVASCRIPT & FIREBASE -->
    <script>
        // Logika Tema
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // --- INISIALISASI FIREBASE ---
        let db = null;
        let dataSiswa = null;
        let semuaModul = []; 
        let kategoriAktif = "KBM_Harian";
        
        let modulAktif = null; 
        let indeksSoalAktif = 0; 

        window.onload = async () => {
            const savedConfig = localStorage.getItem('sakti_school_config');
            const nis = localStorage.getItem('student_nis');

            // --- PROTEKSI HALAMAN (Kembali ke index.html) ---
            if (!savedConfig || !nis) {
                alert("Sesi Anda tidak valid atau telah berakhir. Silakan login kembali.");
                window.location.href = 'index.html'; 
                return;
            }

            try {
                const configObj = JSON.parse(savedConfig);
                let schoolApp;
                if (firebase.apps.filter(app => app.name === 'AppSekolah').length === 0) {
                    schoolApp = firebase.initializeApp(configObj, 'AppSekolah');
                } else {
                    schoolApp = firebase.app('AppSekolah');
                }
                
                await schoolApp.auth().signInAnonymously();
                db = schoolApp.firestore();

                // 1. Ambil Data Siswa (untuk mengecek kelasnya)
                const docSiswa = await db.collection('siswa').doc(nis).get();
                if(!docSiswa.exists) throw new Error("Data siswa tidak ditemukan.");
                dataSiswa = docSiswa.data();
                
                document.getElementById('info-siswa').innerText = `${dataSiswa.nama} • KELAS ${dataSiswa.kelas}`;

                // 2. Tarik Semua Modul Aktif dari Database
                await fetchModulSakti();
                
                // 3. Render Etalase awal
                filterKategori('KBM_Harian');

            } catch(e) {
                console.error(e);
                alert("Terjadi kesalahan: " + e.message);
                window.location.href = 'index.html'; // Jika gagal koneksi DB, kembalikan juga
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        };

        async function fetchModulSakti() {
            try {
                const snap = await db.collection('modul_sakti').where('tugasAktif', '==', true).get();
                semuaModul = [];
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const isTarget = data.is_publik || (data.target_kelas && data.target_kelas.includes(dataSiswa.kelas));
                    if (isTarget) {
                        semuaModul.push({ id: doc.id, ...data });
                    }
                });
            } catch (e) {
                console.error("Gagal menarik data modul:", e);
            }
        }

        // Fungsi Filter Tab Etalase
        function filterKategori(kategori) {
            kategoriAktif = kategori;
            
            document.querySelectorAll('.kategori-tab').forEach(tab => {
                tab.classList.remove('text-indigo-600', 'border-indigo-600', 'dark:text-indigo-400', 'dark:border-indigo-400');
                tab.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
            });
            const activeTab = document.getElementById(`tab-${kategori}`);
            activeTab.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
            activeTab.classList.add('text-indigo-600', 'border-indigo-600', 'dark:text-indigo-400', 'dark:border-indigo-400');

            renderModul();
        }

        // Render Kartu Modul di Etalase
        function renderModul() {
            const container = document.getElementById('modul-container');
            container.innerHTML = ""; 

            const dataFilter = semuaModul.filter(m => m.kategori === kategoriAktif);
            
            dataFilter.sort((a, b) => {
                if(!a.batas_waktu) return 1;
                if(!b.batas_waktu) return -1;
                return new Date(a.batas_waktu) - new Date(b.batas_waktu);
            });

            if (dataFilter.length === 0) {
                // Tampilan jika kosong melompong (Materi belum di-upload)
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-16 text-slate-400 dark:text-slate-500">
                        <i class="ph ph-folder-open text-6xl mb-4 opacity-50"></i>
                        <p class="font-medium text-center px-4">Belum ada modul, materi, atau tugas yang ditambahkan pada kategori ini.<br><span class="text-xs">Silakan periksa kembali nanti atau hubungi guru Anda.</span></p>
                    </div>`;
                return;
            }

            const waktuSekarang = new Date(); 

            dataFilter.forEach((modul, index) => {
                let statusKunci = false;
                let pesanDeadline = `<span class="text-green-600 dark:text-green-400"><i class="ph ph-calendar-check"></i> Bebas Akses (Tanpa Batas Waktu)</span>`;
                
                if (modul.batas_waktu) {
                    const deadline = new Date(modul.batas_waktu);
                    if (waktuSekarang > deadline) {
                        statusKunci = true; 
                        pesanDeadline = `<span class="text-red-500 font-bold"><i class="ph ph-lock-key"></i> Ditutup (Batas Waktu Habis)</span>`;
                    } else {
                        const dlStr = deadline.toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                        pesanDeadline = `<span class="text-orange-500 font-bold"><i class="ph ph-clock-countdown"></i> Sisa waktu s/d ${dlStr}</span>`;
                    }
                }

                const isMateri = modul.tipe_konten === 'materi';
                const iconBtn = isMateri ? '<i class="ph ph-book-open text-lg"></i> Buka Materi' : '<i class="ph ph-play-circle text-lg"></i> Mulai Mengerjakan';
                const bgWarna = isMateri ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/20' : 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-600/20';

                const card = document.createElement('div');
                card.className = `bg-white dark:bg-slate-800 p-6 rounded-2xl border ${statusKunci ? 'border-red-200 dark:border-red-900/50 opacity-75' : 'border-slate-200 dark:border-slate-700 hover:border-indigo-400 dark:hover:border-indigo-500 shadow-sm hover:shadow-md'} transition-all fade-in flex flex-col justify-between`;
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="px-2 py-1 bg-slate-100 dark:bg-slate-700 text-[10px] font-bold rounded uppercase tracking-wider text-slate-600 dark:text-slate-300">
                                ${modul.mapel}
                            </span>
                            <span class="text-xs bg-slate-50 dark:bg-slate-900 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300">
                                👨‍🏫 ${modul.guru_nama}
                            </span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-800 dark:text-white leading-tight mb-2">${modul.judul}</h3>
                        ${isMateri ? '<span class="inline-block px-2 py-0.5 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 text-[10px] rounded font-bold mb-4">Pustaka Materi</span>' : ''}
                        <div class="text-xs mb-6">
                            ${pesanDeadline}
                        </div>
                    </div>
                    
                    <button onclick="bukaModul('${modul.id}', ${statusKunci})" 
                        class="w-full py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-transform active:scale-95
                        ${statusKunci ? 'bg-slate-200 dark:bg-slate-700 text-slate-500 cursor-not-allowed' : bgWarna + ' text-white shadow-lg'}">
                        ${statusKunci ? '<i class="ph ph-lock"></i> Akses Ditutup' : iconBtn}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // --- BUKA MODUL (TUGAS ATAU MATERI) ---
        function bukaModul(id, isLocked) {
            if (isLocked) {
                alert("Maaf, akses ke modul ini telah ditutup karena melewati batas waktu.");
                return;
            }

            modulAktif = semuaModul.find(m => m.id === id);
            
            document.getElementById('simulasi-judul').innerText = modulAktif.judul;
            document.getElementById('simulasi-mapel').innerText = modulAktif.mapel;
            
            if (modulAktif.tipe_konten === 'materi') {
                siapkanTampilanMateri();
            } else {
                siapkanTampilanTugas();
            }

            document.getElementById('view-etalase').classList.add('hidden');
            document.getElementById('view-simulasi').classList.remove('hidden');
            document.getElementById('view-simulasi').classList.add('flex');
            
            if (window.MathJax) MathJax.typesetPromise();
        }

        function siapkanTampilanMateri() {
            document.getElementById('overlay-materi').classList.remove('hidden');
            document.getElementById('overlay-materi').classList.add('flex');
            document.getElementById('wadah-timer').classList.add('hidden'); 
            
            let konten = modulAktif.materi_html || "Tidak ada pengantar.";
            const ytMatch = konten.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com|youtu\.be)\/(?:watch\?v=)?(.+)/);
            if(ytMatch) {
                const videoId = ytMatch[1].split('&')[0];
                konten += `<div class="mt-6 aspect-w-16 aspect-h-9"><iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="w-full h-[60vh] rounded-xl shadow-lg border border-slate-200 dark:border-slate-700"></iframe></div>`;
            }

            document.getElementById('simulasi-wacana-materi').innerHTML = konten;
        }

        function siapkanTampilanTugas() {
            document.getElementById('overlay-materi').classList.add('hidden');
            document.getElementById('overlay-materi').classList.remove('flex');
            document.getElementById('wadah-timer').classList.remove('hidden');
            
            document.getElementById('simulasi-wacana').innerHTML = modulAktif.materi_html || "Bacalah soal di sebelah kanan dengan saksama.";
            
            indeksSoalAktif = 0;
            renderSoalAktif();
        }

        function renderSoalAktif() {
            if (!modulAktif.soal_latihan || modulAktif.soal_latihan.length === 0) return;
            
            const soalData = modulAktif.soal_latihan[indeksSoalAktif];
            document.getElementById('nomor-soal').innerText = indeksSoalAktif + 1;
            document.getElementById('simulasi-pertanyaan').innerHTML = soalData.soal_teks;

            const huruf = ['A', 'B', 'C', 'D', 'E'];
            const opsiHTML = (soalData.opsi || []).map((teks, i) => `
                <label class="opsi-label flex items-start gap-4 p-4 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 rounded-xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors group text-slate-800 dark:text-slate-200">
                    <input type="radio" name="jawaban_soal" value="${huruf[i]}" class="mt-1 w-5 h-5 accent-puspendik-blue focus:ring-2 focus:ring-puspendik-blue">
                    <div class="flex-1">
                        <span class="font-bold mr-2 text-slate-500 dark:text-slate-400">${huruf[i]}.</span> ${teks}
                    </div>
                </label>
            `).join('');
            
            document.getElementById('simulasi-opsi').innerHTML = opsiHTML;
            if (window.MathJax) MathJax.typesetPromise();
        }

        window.navigasiSoal = function(arah) {
            if (!modulAktif || modulAktif.tipe_konten === 'materi') return;
            
            const totalSoal = modulAktif.soal_latihan.length;
            indeksSoalAktif += arah;
            
            if (indeksSoalAktif < 0) indeksSoalAktif = 0;
            if (indeksSoalAktif >= totalSoal) indeksSoalAktif = totalSoal - 1;
            
            renderSoalAktif();
        }

        function tutupSimulasi() {
            const pesan = modulAktif.tipe_konten === 'materi' ? "Tutup materi ini?" : "Apakah Anda yakin ingin keluar dari pengerjaan modul ini? Jawaban belum dikirim.";
            if(confirm(pesan)) {
                document.getElementById('view-simulasi').classList.add('hidden');
                document.getElementById('view-simulasi').classList.remove('flex');
                document.getElementById('view-etalase').classList.remove('hidden');
                modulAktif = null;
            }
        }
    </script>
</body>
</html>
